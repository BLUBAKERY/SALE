<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

:root{
  --a1:#f3c9dc; --a2:#d9a6c2; --a3:#efe3d0; --tx:#3a2630;
  --cream:#fbf5ea; --ink:#3a2417; --ink-soft:#7a5f4e; --canyon:#DF6D41; --butter:#F7D89A; --sky:#8DA6CC; --olive:#AAA648; --brown:#3a2417; --paper:#fff8ea; --mono:'DM Mono',ui-monospace,monospace;
  --radius:22px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Figtree', sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Figtree', sans-serif; font-weight:300;}
button{font-family:inherit; cursor:pointer; border:none;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--a1); color:var(--tx);}
a{color:inherit;}

.hidden{display:none !important;}

/* ---------- Watercolor wash ---------- */
.wash{
  position:relative;
  background:
    radial-gradient(ellipse 80% 60% at 15% 20%, color-mix(in srgb, var(--a1) 80%, transparent), transparent),
    radial-gradient(ellipse 70% 70% at 85% 30%, color-mix(in srgb, var(--a2) 70%, transparent), transparent),
    radial-gradient(ellipse 90% 80% at 50% 90%, color-mix(in srgb, var(--a3) 85%, transparent), transparent),
    linear-gradient(135deg, var(--a2), var(--a1) 60%, var(--a3));
  color:var(--tx);
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px;
  background:rgba(251,247,240,.86);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,0,0,.06);
}
.brand{display:flex; align-items:center; gap:10px; font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:500; font-size:17px; letter-spacing:.2px; background:none;}
.brand svg{flex-shrink:0;}
.cart-btn{
  position:relative; display:flex; align-items:center; justify-content:center;
  width:42px; height:42px; border-radius:50%; background:var(--ink); color:#fff;
}
.cart-count{
  position:absolute; top:-4px; right:-4px; background:#c2503f; color:#fff;
  font-size:11px; width:19px; height:19px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}

/* ---------- Hero ---------- */
.hero{
  padding:22px 22px 20px;
  display:flex; flex-direction:column; justify-content:flex-end;
}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start;}
.hero-eyebrow{
  font-size:13px; letter-spacing:1.5px; text-transform:uppercase; text-align:right;
  line-height:1.5; opacity:.85; max-width:160px;
}
.hero-title{
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:400; font-size:clamp(30px, 8.5vw, 46px);
  line-height:1.05; margin:4px 0 8px;
}
.hero-home{background:var(--canyon); color:var(--paper);}
.hero-home .hero-title{font-weight:600; letter-spacing:-.8px;}
.hero-pills{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
.hero-pills span{background:var(--butter); color:var(--brown); font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:600; font-size:12px; letter-spacing:.08em; padding:6px 12px; border-radius:20px;}
.hero-pills span.soft{background:rgba(255,248,234,.22); color:var(--paper); letter-spacing:.02em; font-weight:500; font-size:13px;}

.info-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(175px,1fr)); gap:8px;
  margin:0 14px 12px;
}
@media (max-width:699px){ .info-grid{grid-template-columns:repeat(2, minmax(0,1fr));} }
.info-card{border-radius:14px; padding:12px 14px 13px; color:var(--brown);}
.info-card:nth-child(4n+1){background:#f8e0a8;}
.info-card:nth-child(4n+2){background:#d9e3f2;}
.info-card:nth-child(4n+3){background:#e6e4ae;}
.info-card:nth-child(4n+4){background:#f6d1bf;}
.info-card .info-title{display:block; font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:700; font-size:14px; letter-spacing:.2px;}
.info-card .info-text{font-size:12px; line-height:1.4; color:#5b4232; margin-top:5px;}

.notice-strip{
  margin:14px 14px 12px; padding:15px 16px; border-radius:16px; background:var(--brown); color:var(--butter);
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14.5px; font-weight:600; text-align:center; line-height:1.45;
}
.map-block{margin:0 14px 22px;}
.map-heading{padding:0 2px 10px; font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:600; font-size:17px;}

.whatsapp-cta{
  margin:0 14px 22px; padding:16px 20px; background:var(--olive); color:var(--brown); border-radius:18px; box-shadow:0 4px 0 var(--brown);
  display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none;
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:700; font-size:19px; text-align:center;
}
.whatsapp-cta:active{transform:scale(.98);}
.promo-banner{
  margin:0 22px 4px; padding:14px 18px; border-radius:14px; background:var(--ink); color:#fff;
  font-size:14px; font-weight:500; text-align:center;
}
.hero-arrow{margin-top:34px;}

/* ---------- Section grid (home) ---------- */
.section-index{padding:16px 14px 10px;}
.index-label{
  padding:0 4px 12px; font-size:15px; color:var(--ink); font-weight:600; font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
.tile-grid{
  display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px;
}
.tile{
  position:relative; overflow:hidden; border-radius:22px; padding:16px 16px 14px; min-height:150px;
  display:flex; flex-direction:column; justify-content:space-between; text-align:right;
  transition:transform .15s ease;
}
.tile-canyon{background:var(--canyon); color:var(--paper);}
.tile-butter{background:var(--butter); color:var(--brown);}
.tile-sky{background:var(--sky); color:#1f2b44;}
.tile-olive{background:var(--olive); color:#2b2a0c;}
.tile::after{
  content:'↗'; position:absolute; right:12px; bottom:10px; font-size:17px; opacity:.75;
}
.tile:active{transform:scale(.97);}
.tile .tile-name{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:23px; font-weight:700; line-height:1.08; letter-spacing:-.2px; display:block; align-self:flex-end;}
.tile .tile-count{font-family:var(--mono); font-size:11.5px; opacity:.8; display:block; text-align:left; align-self:flex-start;}

.footer-strip{
  padding:30px 24px 40px; border-top:1px solid rgba(0,0,0,.07); margin-top:20px;
  display:flex; flex-wrap:wrap; gap:18px; justify-content:space-between; align-items:center;
  font-size:13px; color:var(--ink-soft);
}
.footer-strip a{text-decoration:underline; text-underline-offset:3px;}

/* ---------- Section page ---------- */
.section-header{padding:40px 22px 34px;}
.back-row{display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:22px; opacity:.85;}
.back-row button{background:none; color:inherit; display:flex; align-items:center; gap:6px;}
.section-title{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:300; font-size:clamp(44px,10vw,72px);}

.group-block{padding:26px 0 6px;}
.group-title{padding:0 22px 14px; font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:19px; font-weight:500;}
.row-scroll{
  display:flex; gap:14px; overflow-x:auto; padding:2px 22px 14px; scroll-snap-type:x proximity;
}
.row-scroll::-webkit-scrollbar{height:6px;}
.row-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15); border-radius:10px;}

.card{
  scroll-snap-align:start;
  flex:0 0 210px; background:#fff; border-radius:18px; overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; flex-direction:column;
}
.card-img{
  position:relative; width:100%; height:230px; background:#eee5da;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.card-img img{width:100%; height:100%; object-fit:cover;}
.more-photos{
  position:absolute; right:8px; bottom:10px; z-index:2; display:flex; align-items:center; gap:5px;
  background:rgba(31,26,23,.78); color:#fff; font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:12.5px; font-weight:500;
  padding:5px 10px; border-radius:20px; backdrop-filter:blur(3px);
}
.card-img img.alt{position:absolute; inset:0; opacity:0; transition:opacity .25s;}
@media (hover:hover){ .card:hover .card-img img.alt{opacity:1;} }
.thumb-enh{position:absolute; top:2px; left:2px; padding:2px 6px; background:rgba(255,255,255,.92); border-radius:10px; font-size:9.5px; font-weight:600; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.new-badge{
  position:absolute; left:0; top:12px; z-index:2; padding:5px 10px 5px 9px;
  background:var(--brown); color:var(--butter); font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:600; font-size:10.5px; letter-spacing:.06em;
  line-height:1.1; border-radius:0 8px 8px 0; box-shadow:0 2px 6px rgba(0,0,0,.25); max-width:62%;
}
.detail-imgs-wrap{position:relative;}
.detail-imgs-wrap .new-badge{top:16px; font-size:12px; padding:7px 13px 7px 11px;}
.sec-page{background:var(--sec-soft); min-height:80vh; padding-bottom:40px;}
.sec-page .wash.section-header{background:var(--sec); color:var(--sec-on);}
.sec-page .section-title{font-weight:800; letter-spacing:-1.2px;}
.sec-page .group-title{display:inline-block; padding:7px 16px; margin:0 22px 12px; background:var(--sec); color:var(--sec-on); border-radius:20px; font-weight:700; font-size:16px;}
.sec-page .card{border:2px solid var(--sec); box-shadow:none;}
.sec-page .want-btn{background:var(--sec); color:var(--sec-on); font-weight:700; box-shadow:0 3px 0 var(--brown);}
.sec-page .tag{background:var(--sec-soft); color:var(--brown);}
.sec-page .promo-banner{background:var(--sec); color:var(--sec-on); font-weight:700;}
.sec-page .cat-select{border-color:var(--brown);}
@media (max-width:699px){ .sec-page .group-title{margin:0 14px 10px;} }
.sec-detail .panel-head{background:var(--sec); color:var(--sec-on);}
.sec-detail .detail-price{color:var(--brown);}
.sec-detail .variant-chip.selected{background:var(--sec); color:var(--sec-on); box-shadow:0 3px 0 var(--brown);}
.price-tag{
  background:var(--sec,#F7D89A); color:var(--sec-on,#3a2417);
  position:absolute; left:10px; bottom:10px; padding:6px 12px; border-radius:20px;
  font-size:14px; font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:500;
}
.card-body{padding:12px 13px 14px; display:flex; flex-direction:column; gap:8px; flex:1;}
.card-name{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:17.5px; font-weight:600; line-height:1.25; min-height:auto;}

/* filtro por categoría */
.cat-bar{padding:14px 22px 0; display:flex; align-items:center; gap:10px;}
.cat-select-wrap{position:relative; flex:1; max-width:420px;}
.cat-select{
  width:100%; appearance:none; -webkit-appearance:none; background:#fff; border:1.5px solid var(--ink);
  border-radius:26px; padding:13px 44px 13px 18px; font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:15px; font-weight:500; color:var(--ink);
}
.cat-select-wrap::after{
  content:''; position:absolute; right:18px; top:50%; width:9px; height:9px; margin-top:-7px;
  border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); transform:rotate(45deg); pointer-events:none;
}
.cat-count{font-size:13px; color:var(--ink-soft); white-space:nowrap;}

/* celular: 2 productos por fila y se sigue hacia abajo */
@media (max-width: 699px){
  .group-block{padding:18px 0 4px;}
  .group-title{padding:0 14px 10px; font-size:18px;}
  .row-scroll{
    display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;
    overflow-x:visible; padding:2px 12px 12px; scroll-snap-type:none;
  }
  .card{flex:none; width:100%; border-radius:14px;}
  .card-img{height:auto; aspect-ratio:3/4;}
  .card-body{padding:9px 10px 11px; gap:6px;}
  .card-name{font-size:14px; line-height:1.25;}
  .price-tag{font-size:13px; padding:4px 9px; left:7px; bottom:7px;}
  .more-photos{font-size:11px; padding:3px 8px; right:6px; bottom:7px;}
  .more-photos svg{width:12px; height:12px;}
  .new-badge{font-size:9px; padding:4px 7px 4px 6px; top:8px;}
  .tag{font-size:10px; padding:2px 7px;}
  .want-btn{padding:8px; font-size:13px;}
  .cat-bar{padding:12px 14px 0;}
}
@media (min-width: 700px){
  .row-scroll{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    overflow-x: visible;
  }
  .card{ flex:none; width:100%; }
  .hero-title{ font-size:clamp(36px, 4.5vw, 60px); }
  .hero-pills span{font-size:13.5px; padding:7px 15px;}
  .section-title{ font-size:clamp(44px, 6vw, 72px); }
  .tile-grid{ grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; }
  .tile{min-height:190px;} .tile .tile-name{font-size:28px;}
}
@media (min-width: 1100px){
  .topbar, .hero, .delivery-banner, .whatsapp-cta, .section-index, .footer-strip, .section-header, .group-block{
    max-width:1400px; margin-left:auto; margin-right:auto;
  }
  .wash.hero, .wash.section-header{ max-width:none; }
  .hero > *, .section-header > *{ max-width:1400px; margin-left:auto; margin-right:auto; }
}
.card-tags{display:flex; gap:6px; flex-wrap:wrap;}
.tag{font-size:10.5px; padding:3px 8px; border-radius:20px; background:#f1ece3; color:var(--ink-soft);}
.want-btn{
  margin-top:auto; background:var(--ink); color:#fff; padding:9px; border-radius:20px;
  font-size:13.5px; letter-spacing:.3px; display:flex; align-items:center; justify-content:center; gap:6px;
}
.want-btn:active{transform:scale(.97);}

.empty-note{padding:40px 22px; color:var(--ink-soft); font-size:14px;}

/* ---------- Modal / overlay ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(30,24,20,.45); z-index:90;
  display:flex; justify-content:flex-end; backdrop-filter:blur(2px);
}
.overlay.center{justify-content:center; align-items:center; padding:20px;}
.panel{
  background:#fff; width:min(420px,100%); height:100%; overflow-y:auto;
  display:flex; flex-direction:column;
  animation:slidein .22s ease;
}
@keyframes slidein{from{transform:translateX(100%)} to{transform:translateX(0)}}
.sheet{
  background:#fff; width:min(480px,100%); max-height:92vh; overflow-y:auto; border-radius:20px;
  animation:popin .16s ease;
}
@keyframes popin{from{opacity:0; transform:scale(.97)} to{opacity:1; transform:scale(1)}}
.panel-head{
  display:flex; justify-content:space-between; align-items:center; padding:18px 20px;
  border-bottom:1px solid #eee; position:sticky; top:0; background:#fff; z-index:2;
}
.panel-head h3{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:500; font-size:17px;}
.close-x{width:32px; height:32px; border-radius:50%; background:#f2ede6; display:flex; align-items:center; justify-content:center;}

.detail-modal{
  background:#fff; width:min(640px, 94vw); max-height:92vh; overflow-y:auto; border-radius:20px;
  animation:popin .16s ease;
}
@media (min-width:700px){ .detail-modal{ width:min(880px, 90vw); } }

/* product detail */
.detail-imgs{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:4px;}
.detail-imgs img{width:100%; height:auto; display:block; cursor:zoom-in;}
.detail-body{padding:20px 22px 30px; display:flex; flex-direction:column; gap:14px;}
.detail-price{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:26px; font-weight:500;}
.detail-desc{font-size:14.5px; line-height:1.6; color:var(--ink-soft);}
.spec-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:13.5px;}
.spec-grid div span{display:block; color:var(--ink-soft); font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:2px;}
.qty-row{display:flex; align-items:center; gap:14px;}
.qty-btn{width:34px; height:34px; border-radius:50%; background:#f2ede6; font-size:17px;}
.primary-btn{
  background:var(--ink); color:#fff; padding:14px; border-radius:14px; font-size:15px; text-align:center;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.primary-btn:active{transform:scale(.98);}
.ghost-btn{background:#f2ede6; color:var(--ink); padding:12px; border-radius:14px; font-size:14px; text-align:center;}
.offer-ov{position:fixed; inset:0; background:rgba(15,12,10,.6); z-index:320; display:flex; align-items:flex-end; justify-content:center;}
@media (min-width:700px){ .offer-ov{align-items:center;} }
.offer-box{background:#fffdf9; width:100%; max-width:440px; border-radius:20px 20px 0 0; padding:22px 20px 24px; max-height:92vh; overflow:auto;}
@media (min-width:700px){ .offer-box{border-radius:20px;} }
.offer-box h3{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:19px; margin:0 0 6px;}
.offer-note{background:#fdf1e3; border-radius:12px; padding:11px 13px; font-size:13.5px; line-height:1.45; margin:10px 0 14px;}
.offer-box input{width:100%; padding:12px; border:1px solid #e2dbcf; border-radius:12px; font-size:16px; margin-top:4px;}
.offer-box label{font-size:12.5px; color:var(--ink-soft); display:block; margin-top:10px;}
.offer-warn{font-size:12.5px; color:#b4533a; margin-top:6px; min-height:16px;}
.lightbox{
  position:fixed; inset:0; background:rgba(15,12,10,.94); z-index:300;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.lightbox img{max-width:100%; max-height:100%; object-fit:contain;}
.lightbox-close{
  position:absolute; top:18px; right:18px; width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,.15); color:#fff; display:flex; align-items:center; justify-content:center;
}

/* cart */
.cart-item{display:flex; gap:12px; padding:14px 20px; border-bottom:1px solid #f1ece3;}
.cart-item img{width:64px; height:78px; object-fit:cover; border-radius:10px; background:#eee5da;}
.cart-item-info{flex:1; display:flex; flex-direction:column; gap:6px;}
.cart-item-top{display:flex; justify-content:space-between; gap:8px;}
.cart-item-name{font-size:14px; font-weight:500;}
.cart-item-price{font-size:13.5px; color:var(--ink-soft);}
.cart-qty{display:flex; align-items:center; gap:10px;}
.cart-qty button{width:24px; height:24px; border-radius:50%; background:#f2ede6; font-size:14px;}
.trash-btn{color:#a35847; font-size:12.5px; text-decoration:underline;}
.cart-footer{padding:18px 20px 26px; border-top:1px solid #eee; position:sticky; bottom:0; background:#fff;}
.cart-total-row{display:flex; justify-content:space-between; font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:17px; margin-bottom:14px;}

/* forms */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px;}
.field input, .field textarea, .field select{
  padding:11px 13px; border:1px solid #e2dbcf; border-radius:12px; font-size:14.5px; background:#fbf9f5;
}
.field textarea{resize:vertical; min-height:70px;}
.radio-group{display:flex; gap:10px;}
.radio-opt{
  flex:1; border:1px solid #e2dbcf; border-radius:12px; padding:12px; font-size:13.5px; text-align:center; background:#fbf9f5;
}
.radio-opt.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.info-box{background:#f6f2ea; border-radius:14px; padding:14px 16px; font-size:13.5px; line-height:1.6; color:var(--ink-soft);}
.info-box b{color:var(--ink);}
.map-frame{width:100%; height:150px; border:0; border-radius:12px; margin-top:10px;}

/* toast */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:12px 22px; border-radius:30px; font-size:14px;
  opacity:0; transition:all .25s ease; z-index:200; pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* admin */
.admin-login{min-height:70vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.admin-login-box{width:min(340px,100%); text-align:center;}

function enhanceCanvas(canvas){
  // Mejora automática suave: niveles, luminosidad, color y nitidez
  try{
    const w = canvas.width, h = canvas.height, ctx = canvas.getContext('2d');
    const img = ctx.getImageData(0,0,w,h), d = img.data, n = w*h;
    const hist = new Uint32Array(256); let sum = 0;
    for(let i=0;i<d.length;i+=4){ const l = (0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])|0; hist[l]++; sum += l; }
    let acc=0, lo=0, hi=255;
    for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>=n*0.005){ lo=v; break; } }
    acc=0; for(let v=255;v>=0;v--){ acc+=hist[v]; if(acc>=n*0.005){ hi=v; break; } }
    lo = Math.min(lo, 45); hi = Math.max(hi, 180);
    const gain = Math.min(255/Math.max(1,hi-lo), 1.3);
    const meanAfter = Math.max(1, Math.min(254, (sum/n - lo)*gain));
    let gamma = 1;
    if(meanAfter < 120) gamma = Math.max(0.75, Math.log(125/255)/Math.log(meanAfter/255));
    const lut = new Uint8ClampedArray(256);
    for(let v=0;v<256;v++){
      const x = Math.min(1, Math.max(0, (v-lo)*gain/255));
      lut[v] = Math.round(255*Math.pow(x, gamma));
    }
    const sat = 1.08;
    for(let i=0;i<d.length;i+=4){
      let r=lut[d[i]], g=lut[d[i+1]], b=lut[d[i+2]];
      const l = 0.299*r+0.587*g+0.114*b;
      d[i]=Math.max(0,Math.min(255,l+(r-l)*sat));
      d[i+1]=Math.max(0,Math.min(255,l+(g-l)*sat));
      d[i+2]=Math.max(0,Math.min(255,l+(b-l)*sat));
    }
    // nitidez suave (3x3)
    const src = new Uint8ClampedArray(d), amt = 0.3;
    for(let y=1;y<h-1;y++){
      for(let x=1;x<w-1;x++){
        const p = (y*w+x)*4;
        for(let c=0;c<3;c++){
          const v = src[p+c], nb = src[p-4+c]+src[p+4+c]+src[p-w*4+c]+src[p+w*4+c];
          const o = v + amt*(4*v-nb);
          d[p+c] = o<0?0:(o>255?255:o);
        }
      }
    }
    ctx.putImageData(img,0,0);
  }catch(e){ console.error('mejora de foto falló', e); }
}
function drawToDataUrl(source, srcW, srcH, maxW, quality){
  let w = srcW, h = srcH;
  if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(source, 0, 0, w, h);
  const cb = document.getElementById('pf-enhance');
  if(window.ENHANCE_FORCE || !cb || cb.checked) enhanceCanvas(canvas);
  return canvas.toDataURL('image/jpeg', quality);
}
async function fileToCompressedDataUrl(file, maxW=850, quality=0.68){
  // 1) intento rápido: el navegador decodifica el archivo directo (funciona con HEIC en algunos sistemas)
  if(window.createImageBitmap){
    try{
      const bitmap = await createImageBitmap(file, {imageOrientation:'from-image'});
      const url = drawToDataUrl(bitmap, bitmap.width, bitmap.height, maxW, quality);
      bitmap.close && bitmap.close();
      return url;
    }catch(e){ /* seguimos probando */ }
  }
  // 2) intento clásico vía <img> (jpg, png, webp, etc.)
  try{
    return await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=> resolve(drawToDataUrl(img, img.width, img.height, maxW, quality));
        img.onerror = ()=> reject(new Error('no decodable'));
        img.src = ev.target.result;
      };
      reader.onerror = ()=> reject(new Error('no decodable'));
      reader.readAsDataURL(file);
    });
  }catch(e){ /* seguimos probando */ }
  // 3) conversión HEIC específica vía heic2any
  const isHeic = file.type === 'image/heic' || file.type === 'image/heif' || /\.hei[cf]$/i.test(file.name||'');
  if(isHeic){
    // A) librería moderna (soporta más variantes de HEIC), se carga solo si hace falta
    try{
      if(!window.HeicTo){
        await new Promise((res,rej)=>{
          const sc=document.createElement('script');
          sc.src='https://cdn.jsdelivr.net/npm/heic-to@1.6.5/dist/iife/heic-to.js';
          sc.onload=res; sc.onerror=()=>rej(new Error('no cargó heic-to'));
          document.head.appendChild(sc);
        });
      }
      const jpegBlob = await HeicTo({blob:file, type:'image/jpeg', quality:0.85});
      const bitmap = await createImageBitmap(jpegBlob);
      return drawToDataUrl(bitmap, bitmap.width, bitmap.height, maxW, quality);
    }catch(e){ console.error('heic-to falló', e); }
  }
  if(isHeic && window.heic2any){
    try{
      const converted = await heic2any({blob:file, toType:'image/jpeg', quality:0.85});
      const jpegBlob = Array.isArray(converted) ? converted[0] : converted;
      const bitmap = await createImageBitmap(jpegBlob);
      return drawToDataUrl(bitmap, bitmap.width, bitmap.height, maxW, quality);
    }catch(e){ console.error('heic2any falló', e); }
  }
  throw new Error('no se pudo procesar la imagen');
}
async function uploadProductImage(file, productId){
  try{
    const compressed = await Promise.race([
      fileToCompressedDataUrl(file),
      new Promise((_,rej)=> setTimeout(()=>rej(new Error('timeout')), 45000))
    ]);
    const blob = await (await fetch(compressed)).blob();
    const path = `${productId}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.jpg`;
    const { error } = await sb.storage.from('product-photos').upload(path, blob, { contentType:'image/jpeg' });
    if(error){ showToast('Error subiendo foto: ' + error.message); return null; }
    const { data } = sb.storage.from('product-photos').getPublicUrl(path);
    return data.publicUrl;
  }catch(err){
    // último recurso: subir el archivo tal cual, sin comprimir, para no bloquear la carga
    try{
      const path = `${productId}/${Date.now()}_${Math.random().toString(36).slice(2,7)}_${(file.name||'foto').replace(/[^a-zA-Z0-9.]/g,'')}`;
      const { error } = await sb.storage.from('product-photos').upload(path, file);
      if(error) throw error;
      const { data } = sb.storage.from('product-photos').getPublicUrl(path);
      showToast('Foto subida (puede tardar en mostrarse en algunos navegadores)');
      return data.publicUrl;
    }catch(e2){
      showToast('No se pudo subir esa foto. Probá enviártela por WhatsApp primero y subí esa versión.');
      return null;
    }
  }
}

    const { error } = await sb.from('products').update({

    if(error){ showToast('Error guardando: ' + error.message); return null; }
    return existingId;
  }else{
    const { data: row, error } = await sb.from('products').insert({
      id: productFormPendingId, sector:data.sector, subcategory:data.subcategory, name:data.name,
      description:data.description, estado:data.estado, material:data.material, medidas:data.medidas,
      price:data.price, quantity:data.quantity, images, variants, stock:true,
      ...(HAS_NEW_TAG ? {new_tag:data.newTag} : {})
    }).select().single();
    if(error){ showToast('Error guardando: ' + error.message); return null; }
    return row.id;
  }
}

async function updateOrderStock(items){
  for(const it of items){
    const p = catalog.find(x=>x.id===it.id);
    if(!p) continue;
    if(it.variantId){
      const variants = (p.variants||[]).map(v=> v.id===it.variantId ? {...v, quantity: Math.max(0, (v.quantity||0)-it.qty)} : v);
      const newStock = variants.some(v=>(v.quantity||0)>0);
      await sb.from('products').update({variants, stock:newStock}).eq('id', p.id);
      p.variants = variants; p.stock = newStock;
    }else{
      const newQty = Math.max(0, (p.quantity||1) - it.qty);
      const newStock = newQty > 0;
      await sb.from('products').update({quantity:newQty, stock:newStock}).eq('id', p.id);
      p.quantity = newQty; p.stock = newStock;
    }
  }
}

let HAS_NEW_TAG = true;
function _norm(t){ return (t||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
const SPORTY_RE = /(deport|calza|legging|biker|short|bermuda|top\b|tops\b|musculosa|remera|buzo|campera|jogger|jogging|conjunto|enterito|mono\b|body|malla|bikini|corpino|sosten|bralette|palazzo|pantalon|rompeviento|chaleco|polera|camiseta|tanga|faja|activewear|fitness|pilates|yoga|running|gym|entrenamiento)/;
function isSporty(p){
  if(p.sector !== 'ropa') return false;
  return SPORTY_RE.test(_norm([p.subcategory,p.name,p.description,p.material].join(' ')));
}
function autoNewTag(p){ return p.estado === 'Nuevo' && isSporty(p); }
function showNewTag(p){
  if(p.newTag === true) return true;
  if(p.newTag === false) return false;
  return autoNewTag(p);

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
}
function sectionById(id){ return (config.sections||[]).find(s=>s.id===id); }
const SEC_KINDS = [
  {main:'#F7D89A', soft:'#fdf0d2', on:'#3a2417'},   // Buttercream
  {main:'#8DA6CC', soft:'#e3ebf6', on:'#1f2b44'},   // Morning Sky
  {main:'#AAA648', soft:'#eeedc4', on:'#2b2a0c'},   // Olive Grove
  {main:'#DF6D41', soft:'#f9dccd', on:'#fff8ea'},   // Canyon
];
function secVars(sectorId){
  const i = Math.max(0, (config.sections||[]).findIndex(x=>x.id===sectorId));
  const k = SEC_KINDS[i % SEC_KINDS.length];
  return `--sec:${k.main}; --sec-soft:${k.soft}; --sec-on:${k.on};`;
}
function themeVars(themeName){
  const p = PALETTES[themeName] || PALETTES.rosa;
  return `--a1:${p.a1}; --a2:${p.a2}; --a3:${p.a3}; --tx:${p.tx};`;
}
function compressImage(file, maxW=850, quality=0.68){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function cartKey(id, variantId){ return id + '::' + (variantId||''); }
function variantStock(p, variantId){
  if(!variantId) return Math.max(0, p.quantity||1);
  const v = (p.variants||[]).find(v=>v.id===variantId);
  return v ? Math.max(0, v.quantity||0) : 0;
}
function cartTotal(){
  return cart.reduce((sum, ci)=>{
    const p = catalog.find(x=>x.id===ci.id);
    return sum + (p ? p.price * ci.qty : 0);
  }, 0);
}
function cartCount(){ return cart.reduce((s,c)=>s+c.qty,0); }
function addToCart(id, variant, qty=1){
  const key = cartKey(id, variant && variant.id);
  const existing = cart.find(c=>cartKey(c.id,c.variantId)===key);
  if(existing) existing.qty += qty;
  else cart.push({id, variantId: variant ? variant.id : null, talle: variant ? variant.talle : null, color: variant ? variant.color : null, qty});
  showToast('Agregado al carrito');
  render();
}
function setQty(key, qty){
  const it = cart.find(c=>cartKey(c.id,c.variantId)===key);
  if(!it) return;
  const p = catalog.find(x=>x.id===it.id);
  const max = p ? Math.max(1, variantStock(p, it.variantId)||1) : 99;
  it.qty = Math.max(1, Math.min(qty, max));
  render();
}
function removeFromCart(key){
  cart = cart.filter(c=>cartKey(c.id,c.variantId)!==key);
  render();
}

function render(){
  const app = document.getElementById('app');
  if(view === 'loading'){ app.innerHTML = `<div style="padding:80px; text-align:center; color:#a89a89;">Cargando...</div>`; return; }
  if(view === 'admin-login'){ app.innerHTML = renderAdminLogin(); attachAdminLoginEvents(); return; }
  if(view === 'admin'){ app.innerHTML = renderAdmin(); attachAdminEvents(); return; }

  let html = renderTopbar();
  if(view === 'home') html += renderHome();
  else if(view === 'section') html += renderSectionPage();
  app.innerHTML = html;

  attachCommonEvents();

  if(detailProduct) openDetailOverlay();
  if(cartOpenFlag) renderCartOverlay();
  if(checkoutOpenFlag) renderCheckoutOverlay();
  if(confirmScreenFlag) renderConfirmOverlay();
}

/* ---------- SECTION PAGE ---------- */
function renderSectionPage(){
  const s = sectionById(currentSection);
  if(!s){ view='home'; return renderHome(); }
  const vars = themeVars(s.theme);
  const products = catalog.filter(p=>p.sector===s.id && p.stock);

  const groups = {};
  products.forEach(p=>{
    const key = (p.subcategory && p.subcategory.trim()) || 'Varios';
    if(!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  const groupKeys = Object.keys(groups);
  if(currentSub && !groups[currentSub]) currentSub = '';
  const shownKeys = currentSub ? [currentSub] : groupKeys;
  const shownCount = shownKeys.reduce((a,k)=>a+groups[k].length,0);
  const filterBar = groupKeys.length > 1 ? `
    <div class="cat-bar" id="cat-bar">
      <div class="cat-select-wrap">
        <select class="cat-select" id="sub-filter" aria-label="Ver por categoría">
          <option value="">Todas las categorías (${products.length})</option>
          ${groupKeys.map(k=>`<option value="${k.replace(/"/g,'&quot;')}" ${k===currentSub?'selected':''}>${k} (${groups[k].length})</option>`).join('')}
        </select>
      </div>
      <span class="cat-count">${shownCount} ${shownCount===1?'producto':'productos'}</span>
    </div>` : '';

  let body;
  if(products.length === 0){
    body = `<div class="empty-note">Todavía no hay productos cargados en ${s.label.toLowerCase()}. Volvé pronto.</div>`;
  }else{
    body = shownKeys.map(key=>{
      const cards = groups[key].map(p=> productCardHtml(p)).join('');
      return `<div class="group-block">
        <div class="group-title">${key}</div>
        <div class="row-scroll">${cards}</div>
      </div>`;
    }).join('');
  }

  return `
  <div class="sec-page" style="${secVars(s.id)}">
  <div class="wash section-header" style="${vars}">
    <div class="back-row"><button id="btn-back-home">${ICONS.back} Volver</button></div>
    <h2 class="section-title">${s.label}</h2>
  </div>
  ${(config.promos||[]).filter(pr=>pr.sector===s.id).map(pr=>`<div class="promo-banner">${pr.label}</div>`).join('')}
  ${filterBar}
  ${body}
  </div>
  `;
}

    const v = Math.round(Number(amt.value));

      `*${productTitle(p)}*\nPrecio publicado: ${fmtPrice(p.price)}\nMi oferta: ${fmtPrice(v)}` + (nm ? `\nNombre: ${nm}` : '');

  const updateMax = ()=>{
    const maxQ = hasVariants ? (selectedVariant ? Math.max(1, selectedVariant.quantity||1) : 1) : Math.max(1, p.quantity||1);
    qty = Math.min(qty, maxQ);
    container.querySelector('#detail-qty-val').textContent = qty;
    return maxQ;
  };
  container.querySelector('#detail-close').onclick = ()=>{ detailProduct=null; container.remove(); };

  container.querySelector('#detail-qty-minus').onclick = ()=>{ qty=Math.max(1,qty-1); container.querySelector('#detail-qty-val').textContent=qty; };

      };
    });
  }
  addBtn.onclick = ()=>{
    if(hasVariants && !selectedVariant) return;
    addToCart(p.id, selectedVariant, qty);
    detailProduct=null; container.remove();
  };

      ${cart.length===0 ? `<div class="empty-note">Todavía no agregaste nada. ¡Explorá las secciones!</div>` : `<div style="flex:1;">${items}</div>
      <div class="cart-footer">
        <div class="cart-total-row"><span>Total</span><span>${fmtPrice(cartTotal())}</span></div>
        <button class="primary-btn" id="btn-checkout">Continuar compra</button>
      </div>`}
    </div>`;
  document.body.appendChild(container);
  container.querySelector('#cart-close').onclick = ()=>{ cartOpenFlag=false; container.remove(); };
  container.onclick = (e)=>{ if(e.target===container){ cartOpenFlag=false; container.remove(); } };
  container.querySelectorAll('[data-cartplus]').forEach(b=> b.onclick = ()=>{ const it=cart.find(c=>cartKey(c.id,c.variantId)===b.dataset.cartplus); setQty(b.dataset.cartplus, it.qty+1); container.remove(); renderCartOverlay(); });
  container.querySelectorAll('[data-cartminus]').forEach(b=> b.onclick = ()=>{ const it=cart.find(c=>cartKey(c.id,c.variantId)===b.dataset.cartminus); setQty(b.dataset.cartminus, it.qty-1); container.remove(); renderCartOverlay(); });
  container.querySelectorAll('[data-cartremove]').forEach(b=> b.onclick = ()=>{ removeFromCart(b.dataset.cartremove); container.remove(); if(cart.length) renderCartOverlay(); else { cartOpenFlag=false; } });
  const chk = container.querySelector('#btn-checkout');
  if(chk) chk.onclick = ()=>{ cartOpenFlag=false; checkoutOpenFlag=true; container.remove(); renderCheckoutOverlay(); };
}

  container.querySelectorAll('[data-payment]').forEach(b=> b.onclick=()=>{ checkoutData.payment=b.dataset.payment; container.remove(); renderCheckoutOverlay(); });
  container.querySelector('#btn-confirm-order').onclick = async ()=>{
    checkoutData.name = container.querySelector('#ck-name').value.trim();
    checkoutData.phone = container.querySelector('#ck-phone').value.trim();
    checkoutData.notes = container.querySelector('#ck-notes').value.trim();
    if(!checkoutData.name || !checkoutData.phone){ showToast('Completá nombre y WhatsApp'); return; }
    if(cart.length===0){ showToast('Tu carrito está vacío'); return; }
    const btn = container.querySelector('#btn-confirm-order');
    btn.textContent = 'Enviando...';
    await confirmOrder();
    container.remove();
  };
}

async function confirmOrder(){
  const items = cart.map(ci=>{
    const p = catalog.find(x=>x.id===ci.id);
    const variantLabel = [ci.talle, ci.color].filter(Boolean).join(' - ');
    return {id:ci.id, variantId: ci.variantId, name:p?productTitle(p):'—', variantLabel, price:p?p.price:0, qty:ci.qty};
  });
  const total = cartTotal();
  const order = {
    timestamp: new Date().toISOString(),
    buyer: {name: checkoutData.name, phone: checkoutData.phone},
    items, total,
    delivery: checkoutData.delivery, payment: checkoutData.payment,
    notes: checkoutData.notes
  };
  await insertOrder(order);
  await updateOrderStock(items);

  const lines = items.map(it=>`• ${it.qty}x ${it.name}${it.variantLabel?' ('+it.variantLabel+')':''} — ${fmtPrice(it.price*it.qty)}`).join('%0A');
  const msg = `Hola! Soy ${checkoutData.name}, quiero confirmar este pedido:%0A%0A${lines}%0A%0ATotal: ${fmtPrice(total)}%0AEntrega: ${checkoutData.delivery==='retiro'?'Retiro en Devoto':'Envío a coordinar'}%0APago: ${checkoutData.payment==='efectivo'?'Efectivo':'Transferencia'}${checkoutData.notes ? '%0ANotas: '+checkoutData.notes : ''}%0A%0AMi WhatsApp: ${checkoutData.phone}`;
  window.open(`https://wa.me/${config.whatsapp}?text=${msg}`, '_blank');

  lastOrderSummary = order;
  cart = [];
  checkoutOpenFlag = false;
  confirmScreenFlag = true;
  render();
}

function renderConfirmOverlay(){
  const container = document.createElement('div');
  container.className = 'overlay center';
  container.id = 'confirm-overlay';
  container.innerHTML = `
    <div class="sheet">

        <h2 style="font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:400; font-size:22px;">¡Pedido enviado!</h2>
        <p style="color:#6b5f57; font-size:14px; max-width:280px;">Se abrió WhatsApp con el resumen — mandanos el mensaje para que quede confirmado. Total: <b>${fmtPrice(lastOrderSummary.total)}</b></p>

function attachCommonEvents(){

  });
  const subFilter = document.getElementById('sub-filter');
  if(subFilter) subFilter.onchange = ()=>{
    currentSub = subFilter.value; render();
    const bar = document.getElementById('cat-bar');
    if(bar) window.scrollTo({top: bar.getBoundingClientRect().top + window.scrollY - 70});
  };
  const back = document.getElementById('btn-back-home');
  if(back) back.onclick = goHome;
  const adminLink = document.getElementById('btn-admin-link');
  if(adminLink) adminLink.onclick = openAdminInNewTab;
  document.querySelectorAll('[data-detail]').forEach(c=>{
    c.addEventListener('click', (e)=>{
      if(e.target.closest('[data-addcart]')) return;
      const p = catalog.find(x=>x.id===c.dataset.detail);
      detailProduct = p;
      openDetailOverlay();
    });
  });
  document.querySelectorAll('[data-addcart]').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      const p = catalog.find(x=>x.id===b.dataset.addcart);
      if(p && (p.variants||[]).length){ detailProduct = p; openDetailOverlay(); return; }
      addToCart(b.dataset.addcart, null, 1);
    };
  });
}

function attachAdminEvents(){
  document.getElementById('admin-exit-store').onclick = goHome;
  document.getElementById('admin-logout').onclick = async ()=>{
    await sb.auth.signOut();
    adminAuthed=false; adminSession=null; orders=[];
    goHome();
  };
  document.querySelectorAll('.admin-tab').forEach(t=> t.onclick = ()=>{ adminTab=t.dataset.tab; render(); });

  if(adminTab==='productos'){
    const nb = document.getElementById('btn-new-product');
    if(nb) nb.onclick = ()=>{ productFormEdit='new'; productFormImages=[]; productFormVariants=[]; productFormPendingId=uid(); render(); };
    document.querySelectorAll('[data-editprod]').forEach(b=>{
      b.onclick = ()=>{
        const prod = catalog.find(x=>x.id===b.dataset.editprod);
        productFormEdit = prod;
        productFormImages = [...(prod.images||[])];
        productFormVariants = (prod.variants||[]).map(v=>({...v}));
        productFormPendingId = prod.id;
        render();
      };
    });
    document.querySelectorAll('[data-dupprod]').forEach(b=>{
      b.onclick = ()=>{
        const prod = catalog.find(x=>x.id===b.dataset.dupprod);
        productFormEdit = {...prod, _duplicate:true, name: prod.name + ' (copia)'};
        productFormImages = [...(prod.images||[])];
        productFormVariants = (prod.variants||[]).map(v=>({...v, id:uid()}));
        productFormPendingId = uid();
        render();
      };
    });
    document.querySelectorAll('[data-delprod]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('¿Eliminar este producto?')) return;
        await deleteProduct(b.dataset.delprod);
        catalog = catalog.filter(x=>x.id!==b.dataset.delprod);
        render();
      };
    });
    document.querySelectorAll('[data-stocktoggle]').forEach(b=>{
      b.onclick = async ()=>{
        const prod = catalog.find(x=>x.id===b.dataset.stocktoggle);
        prod.stock = !prod.stock;
        await toggleStock(prod.id, prod.stock);
        render();
      };
    });
  }

  if(adminTab==='pedidos'){
    document.querySelectorAll('[data-orderstatus]').forEach(sel=>{
      sel.onchange = async ()=>{
        const o = orders.find(x=>x.id===sel.dataset.orderstatus);
        o.status = sel.value;
        await sb.from('orders').update({status: sel.value}).eq('id', o.id);
        showToast('Estado actualizado');
      };
    });
  }

  if(adminTab==='config'){
    document.getElementById('btn-save-config').onclick = async ()=>{
      const ok = await saveConfigFields({
        storeName: document.getElementById('cfg-name').value.trim() || config.storeName,
        tagline: document.getElementById('cfg-tagline').value.trim(),
        whatsapp: document.getElementById('cfg-whatsapp').value.trim(),
        alias: document.getElementById('cfg-alias').value.trim(),
        addressRef: document.getElementById('cfg-address').value.trim(),
        deliveryPickup: document.getElementById('cfg-delivery-pickup').value.trim(),
        deliveryShipping: document.getElementById('cfg-delivery-shipping').value.trim(),
        showroomInfo: document.getElementById('cfg-showroom').value.trim(),
        paymentInfo: document.getElementById('cfg-payment').value.trim(),
        noReturnsInfo: document.getElementById('cfg-noreturns').value.trim(),
        freshStockInfo: document.getElementById('cfg-freshstock').value.trim()
      });
      if(ok){ showToast('Datos guardados'); render(); }
    };
    document.querySelectorAll('[data-delsection]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.delsection;
        const inUse = catalog.some(p=>p.sector===id);
        if(inUse){ showToast('Esa sección tiene productos, no se puede borrar'); return; }
        const newSections = config.sections.filter(s=>s.id!==id);
        const ok = await saveConfigFields({sections:newSections});
        if(ok) render();
      };
    });
    document.getElementById('btn-add-section').onclick = async ()=>{
      const label = document.getElementById('new-section-label').value.trim();
      const theme = document.getElementById('new-section-theme').value;
      if(!label){ showToast('Escribí un nombre para la sección'); return; }
      const id = label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid();
      const newSections = [...(config.sections||[]), {id, label, theme}];
      const ok = await saveConfigFields({sections:newSections});
      if(ok) render();
    };
    document.querySelectorAll('[data-delpromo]').forEach(b=>{
      b.onclick = async ()=>{
        const newPromos = (config.promos||[]).filter(pr=>pr.id!==b.dataset.delpromo);
        const ok = await saveConfigFields({promos:newPromos});
        if(ok) render();
      };
    });
    document.getElementById('btn-add-promo').onclick = async ()=>{
      const sector = document.getElementById('new-promo-sector').value;
      const label = document.getElementById('new-promo-label').value.trim();
      if(!label){ showToast('Escribí el texto de la promo'); return; }
      const newPromos = [...(config.promos||[]), {id:uid(), sector, label}];
      const ok = await saveConfigFields({promos:newPromos});
      if(ok) render();
    };
    document.getElementById('btn-save-password').onclick = async ()=>{
      const val = document.getElementById('cfg-password').value;
      if(!val || val.length<6){ showToast('Mínimo 6 caracteres'); return; }
      const { error } = await sb.auth.updateUser({ password: val });
      if(error){ showToast('Error: ' + error.message); return; }
      showToast('Contraseña actualizada');
      document.getElementById('cfg-password').value = '';
    };
  }

  const pf = document.getElementById('product-form-overlay');
  if(pf){
    const isNewProd = productFormEdit === 'new' || !!(productFormEdit && productFormEdit._duplicate);
    let currentEstado = (productFormEdit==='new') ? 'Usado' : productFormEdit.estado;
    document.getElementById('pf-close').onclick = ()=>{ productFormEdit=null; render(); };
    pf.onclick = (e)=>{ if(e.target===pf){ productFormEdit=null; render(); } };
    pf.querySelectorAll('[data-estado]').forEach(b=>{
      b.onclick = ()=>{ currentEstado = b.dataset.estado; pf.querySelectorAll('[data-estado]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); };
    });

    // ---- thumbnails (added/removed without re-rendering the whole form) ----
    const thumbsEl = document.getElementById('pf-thumbs');
    function renderThumbs(){
      thumbsEl.innerHTML = '';
      productFormImages.forEach((url, idx)=>{
        const div = document.createElement('div');
        div.className = 'thumb';
        div.innerHTML = `
          <img src="${url}" />
          <div class="rm">✕</div>
          <div class="thumb-enh" title="Mejorar esta foto">Mejorar</div>
          <div class="thumb-order">
            ${idx>0 ? `<button class="thumb-mv" data-dir="-1">◀</button>` : `<span></span>`}
            ${idx<productFormImages.length-1 ? `<button class="thumb-mv" data-dir="1">▶</button>` : `<span></span>`}
          </div>`;
        div.querySelector('.rm').onclick = ()=>{ productFormImages.splice(idx,1); renderThumbs(); };
        div.querySelector('.thumb-enh').onclick = async (ev)=>{
          const btn = ev.currentTarget; btn.textContent = '...';
          try{
            const blob = await (await fetch(url)).blob();
            window.ENHANCE_FORCE = true;
            const newUrl = await uploadProductImage(blob, productFormPendingId);
            window.ENHANCE_FORCE = false;
            if(newUrl){ productFormImages[idx] = newUrl; showToast('Foto mejorada'); }
          }catch(err){ window.ENHANCE_FORCE = false; console.error(err); showToast('No se pudo mejorar esa foto'); }
          renderThumbs();
        };
        div.querySelectorAll('.thumb-mv').forEach(b=>{
          b.onclick = ()=>{
            const j = idx + Number(b.dataset.dir);
            [productFormImages[idx], productFormImages[j]] = [productFormImages[j], productFormImages[idx]];
            renderThumbs();
          };
        });
        thumbsEl.appendChild(div);
      });
    }
    renderThumbs();
    document.getElementById('pf-photos').onchange = async (e)=>{
      const files = Array.from(e.target.files);
      const statusEl = document.getElementById('pf-upload-status');
      const total = files.length;
      let completed = 0;
      statusEl.textContent = `Subiendo fotos... 0 de ${total}`;
      let nextIdx = 0;
      async function worker(){
        while(nextIdx < files.length){
          const file = files[nextIdx++];
          const url = await uploadProductImage(file, productFormPendingId);
          if(url){ productFormImages.push(url); renderThumbs(); }
          completed++;
          statusEl.textContent = `Subiendo fotos... ${completed} de ${total}`;
        }
      }
      await Promise.all(Array.from({length: Math.min(3, files.length)}, worker));
      statusEl.textContent = '';
      e.target.value = '';
    };

    // ---- talles x colores: se cargan una vez y después solo se completa el stock ----
    const rowsEl = document.getElementById('variant-rows');
    const qtyLabel = document.getElementById('pf-qty-label');
    function updateQtyLabel(){
      qtyLabel.textContent = productFormVariants.length ? 'Cantidad (no se usa si hay variantes abajo)' : 'Cantidad disponible';
    }
    const KEY = (c,t)=> c + '\u0001' + t;
    const vg = { talles:[], colors:[], qty:{}, ids:{} };
    productFormVariants.forEach(v=>{
      const t = (v.talle||'').trim(), c = (v.color||'').trim();
      if(t && !vg.talles.includes(t)) vg.talles.push(t);
      if(c && !vg.colors.includes(c)) vg.colors.push(c);
      vg.qty[KEY(c,t)] = Math.max(0, Number(v.quantity)||0);
      vg.ids[KEY(c,t)] = v.id || uid();
    });
    function vgSync(){
      productFormVariants.length = 0;
      const T = vg.talles.length ? vg.talles : [''], C = vg.colors.length ? vg.colors : [''];
      C.forEach(c=> T.forEach(t=>{
        const k = KEY(c,t);
        if(vg.qty[k] === undefined || (!c && !t)) return;
        if(!vg.ids[k]) vg.ids[k] = uid();
        productFormVariants.push({id:vg.ids[k], talle:t, color:c, quantity:vg.qty[k]});
      }));
      updateQtyLabel();
    }
    function chipsHtml(list, kind){
      return list.map((x,i)=>`<span class="vg-chip">${x}<button type="button" data-rm="${kind}:${i}">✕</button></span>`).join('');
    }
    function renderGrid(){
      document.getElementById('vg-talle-chips').innerHTML = chipsHtml(vg.talles,'t');
      document.getElementById('vg-color-chips').innerHTML = chipsHtml(vg.colors,'c');
      const T = vg.talles.length ? vg.talles : [''], C = vg.colors.length ? vg.colors : [''];
      if(!vg.talles.length && !vg.colors.length){ rowsEl.innerHTML = '<div class="vg-total">Sin talles ni colores: se usa la "Cantidad disponible" de arriba.</div>'; vgSync(); return; }
      rowsEl.innerHTML = `<div class="vg-scroll"><table class="vg-table">
        <tr><th></th>${T.map(t=>`<th>${t||'Único'}</th>`).join('')}</tr>
        ${C.map(c=>`<tr><td class="vg-rowname">${c||'Único color'}</td>${T.map(t=>{
          const v = vg.qty[KEY(c,t)];
          return `<td><input type="number" min="0" inputmode="numeric" data-c="${encodeURIComponent(c)}" data-t="${encodeURIComponent(t)}" value="${v===undefined?'':v}" /></td>`;
        }).join('')}</tr>`).join('')}
      </table></div>
      <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
        <button class="ghost-btn" type="button" id="vg-fill1" style="padding:8px 12px; font-size:12.5px;">Poner 1 en los casilleros vacíos</button>
        <button class="ghost-btn" type="button" id="vg-clear" style="padding:8px 12px; font-size:12.5px;">Vaciar stock</button>
      </div>
      <div class="vg-total" id="vg-total"></div>`;
      const upd = ()=>{
        const tot = Object.values(vg.qty).reduce((a,b)=>a+b,0);
        const el = document.getElementById('vg-total'); if(el) el.textContent = `Total: ${tot} unidades en ${productFormVariants.filter(v=>v.quantity>0).length} combinaciones`;
      };
      rowsEl.querySelectorAll('input[data-t]').forEach(inp=>{
        inp.oninput = ()=>{
          const k = KEY(decodeURIComponent(inp.dataset.c), decodeURIComponent(inp.dataset.t));
          if(inp.value === '') delete vg.qty[k]; else vg.qty[k] = Math.max(0, Math.floor(Number(inp.value)||0));
          vgSync(); upd();
        };
      });
      document.getElementById('vg-fill1').onclick = ()=>{
        C.forEach(c=>T.forEach(t=>{ const k=KEY(c,t); if(vg.qty[k]===undefined) vg.qty[k]=1; }));
        renderGrid();
      };
      document.getElementById('vg-clear').onclick = ()=>{ vg.qty = {}; renderGrid(); };
      vgSync(); upd();
    }
    function addItems(kind, text){
      const parts = String(text).split(kind==='t' ? /[,;\s]+/ : /[,;\n]+/).map(x=>x.trim()).filter(Boolean);
      const list = kind==='t' ? vg.talles : vg.colors;
      parts.forEach(x=>{ if(!list.some(y=>y.toLowerCase()===x.toLowerCase())) list.push(x); });
      renderGrid();
    }
    function removeItem(kind, i){
      const list = kind==='t' ? vg.talles : vg.colors;
      const [gone] = list.splice(i,1);
      Object.keys(vg.qty).forEach(k=>{
        const [c,t] = k.split('\u0001');
        if((kind==='t' && t===gone) || (kind==='c' && c===gone)) delete vg.qty[k];
      });
      renderGrid();
    }
    [['talle','t'],['color','c']].forEach(([n,kind])=>{
      const inp = document.getElementById('vg-'+n+'-input');
      const go = ()=>{ if(inp.value.trim()){ addItems(kind, inp.value); inp.value=''; inp.focus(); } };
      document.getElementById('vg-'+n+'-add').onclick = go;
      inp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } };
    });
    [document.getElementById('vg-talle-chips'), document.getElementById('vg-color-chips')].forEach(box=>{
      box.onclick = (e)=>{ const b = e.target.closest('[data-rm]'); if(!b) return; const [k,i] = b.dataset.rm.split(':'); removeItem(k, Number(i)); };
    });
    const presets = [['S M L XL','S M L XL'],['XS S M L XL','XS S M L XL'],['36 al 44','36 38 40 42 44'],['Único','Único']];
    document.getElementById('vg-talle-presets').innerHTML = '<span style="font-size:12px;color:#a89a89;align-self:center;">Rápido:</span>' + presets.map((p,i)=>`<button type="button" data-preset="${i}">${p[0]}</button>`).join('');
    document.getElementById('vg-talle-presets').onclick = (e)=>{ const b=e.target.closest('[data-preset]'); if(b) addItems('t', presets[Number(b.dataset.preset)][1]); };
    renderGrid();

    document.getElementById('pf-save').onclick = async ()=>{
      const name = document.getElementById('pf-name').value.trim();
      const price = Number(document.getElementById('pf-price').value);
      if(!name || !price){ showToast('Completá al menos nombre y precio'); return; }
      const cleanVariants = productFormVariants.filter(v=>v.talle||v.color).map(v=>({id:v.id, talle:v.talle.trim(), color:(v.color||'').trim(), quantity:Math.max(0, Number(v.quantity)||0)}));
      const data = {
        sector: document.getElementById('pf-sector').value,
        subcategory: document.getElementById('pf-subcategory').value.trim(),
        name,
        description: document.getElementById('pf-description').value.trim(),
        estado: currentEstado,
        material: document.getElementById('pf-material').value.trim(),
        medidas: document.getElementById('pf-medidas').value.trim(),
        price,
        quantity: Math.max(1, Number(document.getElementById('pf-quantity').value)||1),
        newTag: ({on:true, off:false}[document.getElementById('pf-newtag').value]) ?? null,
      };
      const existingId = isNewProd ? null : productFormEdit.id;
      const savedId = await saveProduct(data, productFormImages, cleanVariants, existingId);
      if(!savedId) return;
      if(existingId){
        Object.assign(productFormEdit, data, {images:[...productFormImages], variants:cleanVariants});
      }else{
        catalog.push({id:savedId, stock:true, ...data, images:[...productFormImages], variants:cleanVariants});
      }
      productFormEdit = null;
      productFormImages = [];
      productFormVariants = [];
      showToast('Producto guardado');
      render();
    };
  }
}
